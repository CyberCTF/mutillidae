# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: mutillidae
services:
  database:
    build:
      context: ../../build/database
      labels:
        isoloom.managed: 'true'
        isoloom.environment: mutillidae
    image: isoloom/mutillidae-database
    platform: linux/amd64
    hostname: database
    networks:
      lab:
        ipv4_address: 10.60.4.20
    volumes:
    - database-data:/var/lib/mysql
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3306
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.mariadb: tcp:3306
      isoloom.managed: 'true'
      isoloom.environment: mutillidae
    restart: unless-stopped
  database-routes:
    image: alpine:3.20
    network_mode: service:database
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      database:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: mutillidae
  directory:
    build:
      context: ../../build/directory
      labels:
        isoloom.managed: 'true'
        isoloom.environment: mutillidae
    image: isoloom/mutillidae-directory
