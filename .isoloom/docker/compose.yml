      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 389
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    labels:
      isoloom.service.ldap: tcp:389
      isoloom.managed: 'true'
      isoloom.environment: mutillidae
    restart: unless-stopped
  directory-routes:
