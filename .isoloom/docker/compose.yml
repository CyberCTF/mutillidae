      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      database-routes:
        condition: service_healthy
      directory:
        condition: service_healthy
      directory-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:80
      isoloom.service.https: tcp:443
      isoloom.managed: 'true'
      isoloom.environment: mutillidae
