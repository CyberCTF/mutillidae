apiVersion: batch/v1
kind: Job
metadata:
  name: isoloom-check
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        net.isoloom.com/lab: member
        isoloom.com/check: isoloom-check
    spec:
      restartPolicy: Never
      containers:
      - name: check
