# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP Mutillidae II (by Jeremy Druin, webpwnized) as an Isoloom spec: the application
# (webpwnized/mutillidae, vendored unchanged in build/www/app/) and its container setup
# (webpwnized/mutillidae-docker, vendored unchanged in build/www/docker/), the five upstream
# containers: the web server, MariaDB, OpenLDAP, phpMyAdmin and phpLDAPadmin, with the images
# pinned. The web server builds the database and loads the directory at first start.
# `isoloom generate`, then `isoloom up docker`.
version: 1
name: mutillidae

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.4.0/24, internet: false}

machines:
  database:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {data: /var/lib/mysql}
    ports:
      mariadb:
        port: 3306
    app:
      build: build/database
  directory:
    networks: {lab: 21}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {data: /var/lib/ldap, config: /etc/ldap/slapd.d}
    ports:
      ldap:
        port: 389
    app:
      build: build/directory
  www:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [database, directory]
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 80
        protocol: http
        publish: true
      https:
        port: 443
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/www

  database-admin:
    networks: {lab: 11}
    resources: {cpus: 1, memory_mb: 256}
    depends_on: [database]
    ports:
      phpmyadmin:
        port: 80
        protocol: http
        publish: true
    app:
      build: build/database-admin
  directory-admin:
    networks: {lab: 12}
    resources: {cpus: 1, memory_mb: 256}
    depends_on: [directory]
    ports:
      phpldapadmin:
        port: 80
        protocol: http
        publish: true
    app:
      build: build/directory-admin
checks:
  - name: Mutillidae answers
    http: http://www/
    expect: any
    wait: 180
  - name: the database is built (the home page no longer redirects to the setup page)
    http: http://www/index.php?page=home.php
    expect: 200
    wait: 120
  - name: the LDAP conference room lookup finds a room (the directory is loaded)
    script: checks/ldap-lookup.sh
    wait: 120
  - name: phpMyAdmin answers
    http: http://database-admin/
    wait: 120
  - name: phpLDAPadmin answers
    http: http://directory-admin/
    wait: 120

message: |
  Mutillidae answers at {{ machines.www.ports.web.url }} (HTTPS on
  {{ machines.www.ports.https.published }}). The database and the LDAP directory are already loaded.
  phpMyAdmin: {{ machines.database-admin.ports.phpmyadmin.url }} (root /
  mutillidae); phpLDAPadmin: {{ machines.directory-admin.ports.phpldapadmin.url }}
  (cn=admin,dc=mutillidae,dc=localhost / mutillidae). Turn the hints on from the menu bar.
